<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    <div>
        <h2>Sign Up</h2>
        <input type="email" id="signupEmail" placeholder="Email" value="test@example.com">
        <input type="password" id="signupPassword" placeholder="Password" value="password123">
        <input type="text" id="signupName" placeholder="Name" value="Test User">
        <button onclick="testSignup()">Sign Up</button>
    </div>
    
    <div>
        <h2>Sign In</h2>
        <input type="email" id="signinEmail" placeholder="Email" value="test@example.com">
        <input type="password" id="signinPassword" placeholder="Password" value="password123">
        <button onclick="testSignin()">Sign In</button>
    </div>
    
    <div>
        <h2>Test Auth</h2>
        <button onclick="testAuth()">Test Authentication</button>
    </div>
    
    <div>
        <h2>Debug Sessions</h2>
        <button onclick="debugSessions()">Debug Sessions</button>
    </div>
    
    <div>
        <h2>Fetch Contacts</h2>
        <button onclick="fetchContacts()">Fetch Contacts</button>
    </div>
    
    <div id="output"></div>

    <script>
        const projectId = "pvyzbpcjbjcxqwxlryxh";
        const publicAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2eXpicGNqYmpjeHF3eGxyeXhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NTA5OTMsImV4cCI6MjA3NDEyNjk5M30.i-fJc7puQG-azClNax26_WQFgcO3uEZWeGtzbWrJnwE";
        
        let currentSession = null;

        function log(message, data = null) {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.style.margin = '10px 0';
            div.style.padding = '10px';
            div.style.border = '1px solid #ccc';
            div.innerHTML = `<strong>${message}</strong><br><pre>${data ? JSON.stringify(data, null, 2) : ''}</pre>`;
            output.appendChild(div);
        }

        async function testSignup() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const name = document.getElementById('signupName').value;
            
            try {
                const response = await fetch(`https://${projectId}.supabase.co/functions/v1/make-server-b2516160/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${publicAnonKey}`
                    },
                    body: JSON.stringify({ email, password, name })
                });
                
                const data = await response.json();
                log('Signup Response:', data);
            } catch (error) {
                log('Signup Error:', error.message);
            }
        }

        async function testSignin() {
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;
            
            try {
                const response = await fetch(`https://${projectId}.supabase.co/functions/v1/make-server-b2516160/auth/signin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${publicAnonKey}`
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                log('Signin Response:', data);
                
                if (data.session) {
                    currentSession = data.session;
                    log('Session stored:', currentSession.access_token);
                }
            } catch (error) {
                log('Signin Error:', error.message);
            }
        }

        async function testAuth() {
            if (!currentSession) {
                log('No session available');
                return;
            }
            
            try {
                const response = await fetch(`https://${projectId}.supabase.co/functions/v1/make-server-b2516160/test-auth`, {
                    headers: {
                        'Authorization': `Bearer ${currentSession.access_token}`
                    }
                });
                
                const data = await response.json();
                log('Auth Test Response:', data);
            } catch (error) {
                log('Auth Test Error:', error.message);
            }
        }

        async function debugSessions() {
            try {
                const response = await fetch(`https://${projectId}.supabase.co/functions/v1/make-server-b2516160/debug-sessions`);
                const data = await response.json();
                log('Debug Sessions Response:', data);
            } catch (error) {
                log('Debug Sessions Error:', error.message);
            }
        }

        async function fetchContacts() {
            if (!currentSession) {
                log('No session available');
                return;
            }
            
            try {
                const response = await fetch(`https://${projectId}.supabase.co/functions/v1/make-server-b2516160/contacts`, {
                    headers: {
                        'Authorization': `Bearer ${currentSession.access_token}`
                    }
                });
                
                const data = await response.json();
                log('Contacts Response:', data);
            } catch (error) {
                log('Contacts Error:', error.message);
            }
        }
    </script>
</body>
</html>
